# About Section configuration
about_content: |
  Hello there! I'm Felix, a Systems Engineer at VisionLab with over 7 years of experience in IT infrastructure, automation, and cloud.
  I specialise in <mark>Microsoft 365 and Azure</mark>, <mark>Intune and Entra ID</mark>, <mark>PowerShell and RMM automation</mark>, <mark>backup and disaster recovery</mark>, and <mark>secure AI adoption</mark>, supporting businesses, schools, and iwi across the Bay of Plenty.
  Outside of work, I run my own game-server hosting platform on Laravel, Docker, and self-hosted infrastructure.

# Main content configuration
