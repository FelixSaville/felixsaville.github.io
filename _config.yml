          Managed and deployed Microsoft, Linux, and Apple systems for iwi, schools, and businesses. Designed and delivered IT projects, built PowerShell automation to sync accounts across Microsoft 365, Google Workspace, and Apple School Manager, and handled escalated helpdesk requests.
      - layout: left
        title: Timberlands Limited
        link: https://tll.co.nz/
