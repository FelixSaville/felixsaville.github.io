        title: VisionLab
        link: https://visionlab.nz/
        sub_title: Systems Engineer
        caption: January 2026 - Present
        quote: "Secure, modern IT for Bay of Plenty businesses."
        description: |
          Lead client projects for a Te Puke managed service provider, from tenant migrations and Linux server rebuilds to Veeam disaster recovery, CyberCert assessments, and NinjaOne automation. Wrote VisionLab's framework for deploying Claude AI securely into Microsoft 365 tenants, and lead those rollouts.
      - layout: left
        title: OmniNet Limited
        link: https://www.omninet.co.nz/
        sub_title: Systems Engineer
        caption: July 2024 - December 2025
        quote: "Driving innovation and efficiency through cloud-first IT solutions."
        description: |
          Technical lead on client projects covering Azure AD migrations, Microsoft 365 deployments, Intune and Autopilot device management, and endpoint security. Provided escalation support and managed client onboarding.
      - layout: left
        title: mb3 Limited
        link: https://www.mb3.nz/
        sub_title: Systems Engineer
        caption: March 2022 - July 2024
        quote: "Enriching lives using Apple technology. Inspire, Innovate, Empower."
