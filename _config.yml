# About Section configuration
about_content: |
  Hello there! I'm Felix, a Systems Engineer at VisionLab with over 7 years of experience in IT infrastructure, automation, and cloud.
  I specialise in <mark>Microsoft 365 and Azure</mark>, <mark>Intune and Entra ID</mark>, <mark>PowerShell and RMM automation</mark>, <mark>backup and disaster recovery</mark>, and <mark>secure AI adoption</mark>. Over my career I've supported businesses, schools, and iwi across the Bay of Plenty, from day-to-day helpdesk through to leading migrations, security reviews, and infrastructure rebuilds.
  I enjoy taking messy, manual environments and turning them into something documented, automated, and secure, and explaining the why to clients along the way.
  Outside of work, I run my own game-server hosting platform built on Laravel, Docker, and self-hosted infrastructure, which keeps my Linux and networking skills sharp.

# Main content configuration
content:
  - title: Experience
    layout: list
    content:
      - layout: left
        title: VisionLab
        link: https://visionlab.nz/
        sub_title: Systems Engineer
        caption: January 2026 - Present
        quote: "Secure, modern IT for Bay of Plenty businesses."
        description: |
          Systems Engineer at a Te Puke managed service provider, supporting businesses in agriculture, engineering, healthcare, veterinary, and professional services. Lead client projects end to end, from Microsoft 365 tenant and email migrations and Linux server rebuilds to Veeam backup and disaster recovery, CyberCert security assessments, and NinjaOne automation. Work daily across Microsoft 365, Intune, Entra ID, and Azure using NinjaOne, HaloPSA, IT Glue, and ScreenConnect. Also wrote VisionLab's framework for deploying Claude AI securely into client Microsoft 365 tenants, and lead those rollouts.
      - layout: left
        title: OmniNet Limited
        link: https://www.omninet.co.nz/
        sub_title: Systems Engineer
        caption: July 2024 - December 2025
        quote: "Driving innovation and efficiency through cloud-first IT solutions."
        description: |
          Technical lead on client projects at a managed service provider, covering Azure AD migrations, Microsoft 365 deployments, Intune and Autopilot device management, and endpoint security. Delivered cross-tenant migrations, firewall replacements, and kiosk and iPad deployments, and built deployment templates reused across multiple clients. Provided escalation support and managed new client onboarding.
      - layout: left
        title: mb3 Limited
        link: https://www.mb3.nz/
        sub_title: Systems Engineer
        caption: March 2022 - July 2024
        quote: "Enriching lives using Apple technology. Inspire, Innovate, Empower."
        description: |
          Managed and deployed Microsoft, Linux, and Apple systems for iwi, schools, and businesses across the Bay of Plenty. Built a PowerShell automation framework that synced accounts between school management systems, Microsoft 365, Google Workspace, and Apple School Manager, handling account creation, licensing, and groups. Also built a Proxmox private cloud for in-house tools, and handled escalated helpdesk requests.
      - layout: left
        title: Timberlands Limited
        link: https://tll.co.nz/
        sub_title: IT Support Specialist
        caption: October 2019 - March 2022
        quote: "We commit to being the best and safest production forest in the world, Mo ake tonu atu."
        description: |
          Supported staff on-site and remotely across Citrix and a private cloud environment. Led a company-wide laptop rollout during pandemic chip shortages, covering procurement, deployment, cybersecurity training, and support, so the business could move to remote work. Also rebuilt the company website in-house and introduced Snipe-IT for asset management.
      - layout: left
        title: Spark Rotorua
        link: https://www.spark.co.nz/
        sub_title: Sales Consultant
        caption: November 2018 - March 2019
        quote: "The best hands-on experience is front-facing all types of customers, assisting NZ in the digital world."
        description: |
          Advised customers on devices, plans, and digital services, finding the right fit for each person. Exceeded sales targets with 60 solutions sold in a single month.

  - title: Education
    layout: list
    content:
      - layout: left
        title: Avonmore / EmployNZ
        caption: February 2016 - November 2018
        sub_title: Diploma in Systems Administration (Level 6)
        quote: "EmployNZ helped me learn a lot around System Deployment and Management, and I couldn’t have done IT without their Hands-On Teaching."
        description: |
          Built my foundation in operating systems, networking, system deployment, and programming, along with teamwork and working to tight deadlines.

  - title: Projects
    layout: list
    content:
      - layout: top-middle
        title: VoIP Deployment
        quote: "September 2022 - April 2024"
        description: |
          Deployed Webex, Microsoft Teams calling, and UCXpress (Access4) phone systems for schools and businesses across the Bay of Plenty, moving clients onto cloud calling and building them better ways to collaborate.
      - layout: top-middle
        title: Cross-Tenant Microsoft 365 Migration
        quote: "August 2024 – September 2024"
        description: |
          Consolidated two Microsoft 365 tenants with AvePoint Fly, moving mailboxes and calendars between them. Wrote PowerShell to replicate mailbox permissions and calendar delegations, then coordinated the DNS cutover with minimal downtime for users.
      - layout: top-middle
        title: Autopilot Deployment Project
        quote: "May 2025 - June 2025"
        description: |
          Designed and rolled out a 35-device deployment with Intune and Autopilot, including Win32 app packaging, Defender, and conditional access policies. Built templates for Start menu layouts, taskbar pins, and Office provisioning, delivered across multiple clients.
      - layout: top-middle
        title: Claude AI Deployment Framework
        quote: "2026"
        description: |
          Wrote VisionLab's internal guide to advising clients on Claude: discovery questions, choosing the right plan for their data and Privacy Act obligations, and connecting it to Microsoft 365 with the least access needed. Led client rollouts including SSO, auto-provisioning groups, Microsoft 365 and Xero integrations, and user training.
      - layout: top-middle
        title: Linux Application Server Rebuild
        quote: "2026"
        description: |
          Audited a client's internet-facing CentOS 8 server running the production, UAT, and development environments of a Rust and React web platform. Found an exposed end-of-life PostgreSQL database, services running as root, and no active firewall. Planned a clean rebuild on Oracle Linux rather than a risky in-place upgrade, including the database migration, after-hours cutover, and decommission.
      - layout: top-middle
        title: Azure Backup & Disaster Recovery
        quote: "2026"
        description: |
          Designed two-layer backup for an Azure-hosted client: Veeam Data Cloud for recovery inside Azure, plus Veeam Backup & Replication with a VisionLab-held copy that can restore anywhere. Set up tiered retention from 8-hourly snapshots to 12 months of monthly backups, proved it with a full restore into Hyper-V, and wrote the disaster recovery plan.
      - layout: top-middle
        title: Compliance Call Recording & Transcription
        quote: "2026"
        description: |
          Designed policy-enforced call recording for a multi-site engineering firm, which starts automatically and can't be stopped or deleted by users. Designed an automated pipeline that stores transcripts and audio in SharePoint, with a permission model that limits each recording to the people in that meeting. Built a Node.js MCP server so staff can search and summarise their calls with Claude.
      - layout: top-middle
        title: CyberCert Security Assessments
        quote: "2026"
        description: |
          Assessed small businesses against New Zealand's CyberCert controls, covering RMM and EDR coverage, MFA, email authentication (SPF, DKIM, DMARC), firewalls, backups, and security policies. Turned the gaps into prioritised remediation tickets and proposals, and helped bring VisionLab's own environment up to the same standard.
      - layout: top-middle
        title: Legacy Database Review & Modernisation
        quote: "2026"
        description: |
          Reviewed an agricultural contractor's three linked Microsoft Access systems, which ran their whole job lifecycle from orders to invoicing. Documented every table, form, report, and sync script, flagged a data-loss risk in how data moved between machines, and scoped a replacement on Power Apps and Dataverse.
      - layout: top-middle
        title: Dracxi Hosting
        quote: "2025 - Present"
        description: |
          Built and run a game-server hosting business for New Zealand and Australia, on Laravel, PostgreSQL, and Stripe billing. Self-hosted with Docker Compose behind Cloudflare and a FortiGate firewall, with automated deployments, Uptime Kuma monitoring, and GlitchTip error tracking, all reporting to Discord.

