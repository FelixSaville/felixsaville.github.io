        caption: October 2019 - March 2022
        quote: "We commit to being the best and safest production forest in the world, Mo ake tonu atu."
        description: |
          Supported staff on-site and remotely across Citrix and a private cloud environment. Led a company-wide laptop rollout through pandemic supply shortages to support the move to remote work.
      - layout: left
        title: Spark Rotorua
        link: https://www.spark.co.nz/
        sub_title: Sales Consultant
        caption: November 2018 - March 2019
        quote: "The best hands-on experience is front-facing all types of customers, assisting NZ in the digital world."
        description: |
          Advised customers on devices and digital services, exceeding sales targets with 60 solutions sold in a single month.

  - title: Education
    layout: list
    content:
      - layout: left
        title: Avonmore / EmployNZ
        caption: February 2016 - November 2018
        sub_title: Diploma in Systems Administration (Level 6)
        quote: "EmployNZ helped me learn a lot around System Deployment and Management, and I couldn’t have done IT without their Hands-On Teaching."
        description: |
          Built my foundation in operating systems, networking, system deployment, and programming, along with teamwork and working to tight deadlines.

  - title: Projects
    layout: list
    content:
      - layout: top-middle
        title: VoIP Deployment
        quote: "September 2022 - April 2024"
        description: |
          Deployed Webex, Microsoft Teams calling, and UCXpress (Access4) phone systems for schools and businesses across the Bay of Plenty.
      - layout: top-middle
        title: Cross-Tenant Microsoft 365 Migration
        quote: "August 2024 – September 2024"
        description: |
          Merged two Microsoft 365 tenants with AvePoint Fly, using PowerShell to carry over mailbox permissions and calendar delegations. Coordinated the DNS cutover with minimal downtime.
      - layout: top-middle
        title: Autopilot Deployment Project
        quote: "May 2025 - June 2025"
        description: |
          Rolled out 35 devices with Intune and Autopilot, including Win32 app packaging, Defender, and conditional access. Built reusable deployment templates now used across multiple clients.
      - layout: top-middle
        title: Claude AI Deployment Framework
        quote: "2026"
        description: |
          Wrote VisionLab's guide to choosing the right Claude plan for a client's data and Privacy Act obligations, and to connecting it to Microsoft 365 safely. Led client rollouts, including SSO, auto-provisioning, and Microsoft 365 and Xero integrations.
      - layout: top-middle
        title: Linux Application Server Rebuild
        quote: "2026"
        description: |
          Audited a client's internet-facing CentOS 8 web platform and found exposed database ports, root-level services, and no firewall. Planned a clean rebuild on Oracle Linux, including the database migration and cutover.
      - layout: top-middle
        title: Azure Backup & Disaster Recovery
        quote: "2026"
        description: |
          Designed two-layer Veeam protection for an Azure-hosted client, with in-Azure recovery plus a portable copy held by VisionLab. Proved it with a full restore into Hyper-V and wrote the disaster recovery plan.
      - layout: top-middle
        title: Compliance Call Recording & Transcription
        quote: "2026"
        description: |
          Designed policy-enforced call recording for a multi-site engineering firm, with transcripts stored automatically in SharePoint and access limited to each meeting's participants. Built a Node.js MCP server so staff can search their calls with Claude.
      - layout: top-middle
        title: CyberCert Security Assessments
        quote: "2026"
        description: |
          Assessed small businesses against New Zealand's CyberCert controls, from MFA and EDR to email authentication and backups. Turned the gaps into prioritised remediation plans.
      - layout: top-middle
        title: Legacy Database Review & Modernisation
        quote: "2026"
        description: |
          Reviewed an agricultural contractor's three linked Microsoft Access systems, flagged a data-loss risk in how they synced, and scoped a replacement on Power Apps and Dataverse.
      - layout: top-middle
        title: Dracxi Hosting
        quote: "2025 - Present"
        description: |
          Built and run a game-server hosting business for New Zealand and Australia on Laravel, PostgreSQL, and Stripe. Self-hosted with Docker behind Cloudflare and FortiGate, with automated deployments, uptime monitoring, and error tracking.

